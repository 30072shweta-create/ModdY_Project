<section class="chat-widget" [class.chat-widget--open]="isOpen" aria-label="Meridian Flight Assistant">

  <!-- Toggle Button -->
  <button class="chat-toggle-btn" type="button" (click)="toggleChat()" aria-label="Toggle Meridian AI Assistant">
    @if (!isOpen) {
      <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
      </svg>
      <span class="chat-badge">AI</span>
    } @else {
      <span class="close-icon">&times;</span>
    }
  </button>

  <!-- Chat Panel -->
  <div class="chat-panel" *ngIf="isOpen">

    <!-- Header -->
    <div class="chat-header">
      <div class="header-title-box">
        <div class="ai-avatar">
          <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M12 2a2 2 0 0 1 2 2v2a2 2 0 0 1-2 2 2 2 0 0 1-2-2V4a2 2 0 0 1 2-2z"/>
            <path d="M4 11a2 2 0 0 1 2-2h12a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H6a2 2 0 0 1-2-2v-7z"/>
            <circle cx="9" cy="14" r="1"/><circle cx="15" cy="14" r="1"/>
          </svg>
        </div>
        <div>
          <h3>Meridian Flight Assistant</h3>
          <span class="status-indicator">AI Support &bull; Always available</span>
        </div>
      </div>
      <button type="button" class="header-close" (click)="toggleChat()">&times;</button>
    </div>

    <!-- Domain Selector Strip -->
    <div class="domain-strip">
      <span class="domain-strip-title">Topic:</span>
      <div class="domain-chips-scroll">
        <button
          type="button"
          class="domain-chip"
          *ngFor="let domain of domains"
          [class.active]="selectedDomain === domain.value"
          (click)="selectedDomain = domain.value"
        >
          {{ domain.name }}
        </button>
      </div>
    </div>

    <!-- Messages Body -->
    <div class="messages-body" aria-live="polite">
      <div
        class="message-row"
        *ngFor="let item of messages"
        [class.user]="item.role === 'user'"
        [class.assistant]="item.role === 'assistant'"
      >
        <div
          class="bubble"
          [innerHTML]="formatMessage(item.text)"
        ></div>
      </div>

      <!-- Loading dots -->
      <div class="message-row assistant" *ngIf="isLoading">
        <div class="bubble loading-bubble">
          <span class="dot"></span>
          <span class="dot"></span>
          <span class="dot"></span>
        </div>
      </div>
    </div>

    <!-- Input Bar -->
    <form class="chat-input-bar" (ngSubmit)="sendMessage()">
      <input
        type="text"
        name="message"
        [(ngModel)]="message"
        maxlength="1000"
        autocomplete="off"
        placeholder="Ask about flights, bookings, pricing..."
        [disabled]="isLoading"
      />
      <button
        type="submit"
        class="btn-send"
        [disabled]="isLoading || !message.trim()"
        aria-label="Send message"
      >
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
          <line x1="22" y1="2" x2="11" y2="13"></line>
          <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
        </svg>
      </button>
    </form>

  </div>
</section>
